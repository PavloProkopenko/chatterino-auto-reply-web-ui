name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, shell: pwsh }
          - { name: macos-arm64, os: macos-latest, shell: bash }
          - { name: macos-x64, os: macos-15-intel, shell: bash }
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # prepare.* installs pinned Node + pnpm into .tools, then runs lint, tests, vendor drift check and build smoke.
      - name: prepare (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: scripts/prepare.ps1
      - name: prepare (macOS)
        if: matrix.shell == 'bash'
        shell: bash
        run: scripts/prepare.sh --ci
