name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      # pinned pnpm, install from the lockfile, lint, typecheck, unit tests, vendored-plugin drift check, production build
      - name: prepare
        run: scripts/prepare.sh --ci --no-e2e
      - name: browser for e2e
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/.tools/browsers"
          .tools/pnpm/node_modules/.bin/pnpm exec playwright install --with-deps chromium
      - name: e2e
        run: .tools/pnpm/node_modules/.bin/pnpm test:e2e
